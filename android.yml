name: Build Android APK
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: node scripts/build-web.mjs --native
      - name: Create Android project
        run: npx cap add android
      - run: node scripts/patch-android.mjs
      - name: Launcher icons (best effort)
        run: npx @capacitor/assets generate --android --assetPath assets || true
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: SanaVerse-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Attach APK to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: android/app/build/outputs/apk/debug/app-debug.apk }
